[package]
# Should match .rustfmt.toml
edition = "2024"
name = "sccache"
rust-version = "1.92.0"
version = "0.18.0-rapids.16"

categories = ["command-line-utilities", "development-tools::build-utils"]
description = "Sccache is a ccache-like tool. It is used as a compiler wrapper and avoids compilation when possible. Sccache has the capability to utilize caching in remote storage environments, including various cloud storage options, or alternatively, in local storage."
keywords = ["ccache"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mozilla/sccache/"

# The files under tests/ are modules of the single `integration` test target.
autotests = false

[package.metadata.binstall]
bin-dir = "sccache-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/sccache-v{ version }-{ target }{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
# There are no runnable doc examples, but `cargo test` would still have rustdoc
# expand the whole crate just to report them as ignored.
doctest = false

[[bin]]
name = "sccache"

[[bin]]
name = "sccache-dist"
required-features = ["dist-server"]

[[test]]
name = "integration"
path = "tests/main.rs"

# [profile.dev]
# debug = "line-tables-only"

[profile.test]
debug = false # save disk space

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
ar = "0.9"
async-compression = { version = "0.4", features = [
  "futures-io",
  "gzip",
  "zlib",
] }
async-stream = "0.3"
async-trait = "0.1.89"
backon = { version = "1", default-features = false, features = [
  "std-blocking-sleep",
] }
base64 = "0.21"
bincode = "1"
blake3 = "1"
byteorder = "1.5"
bytes = "1"
cached = { version = "4", features = ["async"] }
chrono = "0.4"
clap = { version = "4.5.13", features = ["derive", "env", "wrap_help"] }
directories = "5.0.1"
dunce = "1.0.5"
encoding_rs = "0.8"
env_logger = "0.11"
filetime = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
fs-err = "3"
futures = "0.3"
gzp = { version = "2", default-features = false, features = ["deflate_rust"] }
http = "1.0"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.1", optional = true, features = [
  "server",
  "http1",
  "http2",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  # Default features except rustls provider
  "native-tokio",
  "http1",
  "tls12",
  "logging",
  "ring",
], optional = true }
hyper-util = { version = "0.1.21", optional = true, features = [
  "http1",
  "http2",
  "tokio",
  "server",
] }
is_executable = { version = "1.0.4" }
itertools = "0.14"
jobserver = "0.1"
jwt = { package = "jsonwebtoken", version = "9", optional = true, default-features = false }
libc = "0.2.153"
linked-hash-map = "0.5"
log = "0.4"
memchr = "2"
memmap2 = "0.9.4"
metrics = { version = "0.24", default-features = false, optional = true }
metrics-exporter-dogstatsd = { version = "0.9", default-features = false, optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true, features = [
  "http-listener",
  "push-gateway-no-tls-provider",
] }
metrics-util = { version = "0.20", default-features = false, optional = true }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "std",
  "tls12",
  "ring",
] }

mime = "0.3"
notify-debouncer-full = { version = "0.7", optional = true }
object = { version = "0.37", default-features = false, features = [
  "read",
  "std",
] }
opendal = { version = "0.58.1", default-features = false }
opendal-http-transport-reqwest = { version = "0.58.1", optional = true, default-features = false, features = [
  "rustls-no-provider",
] }
opendal-layer-logging = { version = "0.58.1", optional = true }
rand = "0.8.4"
regex = "1.10.3"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "hickory-dns",
  "http2",
  "json",
  "rustls-no-provider",
  "stream",
  "system-proxy",
], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde-env = { git = "https://github.com/trxcllnt/serde-env.git", branch = "revert/remove-logging" }
# Or use this to debug serde-env deserialization behavior
# serde-env = { git = "https://github.com/trxcllnt/serde-env.git", branch = "revert/remove-logging", features = ["log"] }
serde-patch = { version = "0.2" }
serde_json = ">=1.0, <1.0.147" # zmij (used in 1.0.147+) requires Rust 1.84+
serde_path_to_error = "0.1"
serde_with = { version = "3" }
sha2 = { version = "0.10.8", optional = true }
shlex = "2.0.1"
strip-ansi-escapes = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tar = "0.4.46"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-retry2 = { version = "0.5", features = ["jitter"] }
tokio-serde = "0.9"
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7", features = [
  "codec",
  "compat",
  "io",
  "io-util",
  "rt",
] }
toml = "0.9"
tower = { version = "0.5", default-features = false }
typed-path = "0.12.0"
unit-prefix = "0.5"
url = { version = "2", optional = true }
uuid = { version = "1.9", features = ["v4"] }
walkdir = "2"
# by default which pulls in an outdated failure version
which = { version = "6", default-features = false }
winsplit = "0.1"
zip = { version = "0.6", default-features = false }
zstd = "0.13"

# dist-server only
axum = { version = "0.8", features = ["http2"], optional = true }
axum-extra = { version = "0.12", features = ["typed-header"], optional = true }
axum-server = { version = "0.8", default-features = false, optional = true }
celery = { git = "https://github.com/trxcllnt/rusty-celery.git", branch = "sccache", optional = true, default-features = false, features = [
  "codegen",
  "msgpack",
  "rustls-native-certs",
  "hickory-dns",
  "rustls--ring",
] }
nix = { version = "0.30.0", optional = true, features = [
  "mount",
  "user",
  "sched",
  "signal",
  "process",
] }
syslog = { version = "7", optional = true }
tower-http = { version = "0.6", features = [
  "limit",
  "request-id",
  "sensitive-headers",
  "trace",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
version-compare = { version = "0.1.1", optional = true }

# dist-tests only (tests/oauth.rs). As a dev-dependency it would be built by
# every test build and turn on serde_json/preserve_order for all of them.
thirtyfour = { version = "0.36", optional = true, default-features = false, features = [
  "reqwest",
] }

# bench only (benches/sccache_bench.rs). As a dev-dependency it would be built
# by every test build.
divan = { package = "codspeed-divan-compat", version = "4", optional = true }

[dev-dependencies]
assert_cmd = "2.0.13"
cc = "1.0"
chrono = "0.4.42"
filetime = "0.2"
pastey = "0.2"
predicates = "=3.1.0"
serial_test = "3.1"
temp-env = "0.3.6"
test-case = "3.3.1"
version-compare = { version = "0.1.1" }

[target.'cfg(unix)'.dependencies]
daemonix = "0.1"

[target.'cfg(not(target_os = "freebsd"))'.dependencies.libmount]
optional = true
version = "0.1.15"

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Security",
]
version = "0.52"

[features]
all = ["cloud-storage", "dist-client"]
azure = [
  "opendal/services-azblob",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "reqwest",
]
cloud-storage = [
  "redis",
  "s3",
  "memcached",
  "gcs",
  "azure",
  "gha",
  "webdav",
  "oss",
  "cos",
]
cos = [
  "opendal/services-cos",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "reqwest",
]
default = ["all"]
gcs = [
  "opendal/services-gcs",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "url",
  "reqwest",
]
gha = [
  "opendal/services-ghac",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "reqwest",
]
memcached = ["opendal/services-memcached", "opendal-layer-logging"]
native-zlib = []
oss = [
  "opendal/services-oss",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "reqwest",
]
redis = ["url", "opendal/services-redis", "opendal-layer-logging"]
s3 = [
  "opendal/services-s3",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "reqwest",
  "watcher",
]
watcher = ["notify-debouncer-full"]
webdav = [
  "opendal/services-webdav",
  "opendal-layer-logging",
  "opendal-http-transport-reqwest",
  "reqwest",
]
# Enable features that will build a vendored version of openssl and
# statically linked with it, instead of linking against the system-wide openssl
# dynamically or statically.
vendored-openssl = ["reqwest?/native-tls-vendored"]
# Enable features that require unstable features of Nightly Rust.
unstable = []
# Enables distributed support in the sccache client
dist-client = [
  "http-body-util",
  "hyper",
  "hyper-util",
  "reqwest",
  "url",
  "sha2",
  "rustls-native-certs",
]
# Enables the sccache-dist binary
dist-server = [
  "axum-extra",
  "axum-server",
  "axum",
  "celery",
  "cloud-storage",
  "http-body-util",
  "hyper-rustls",
  "hyper-util",
  "hyper",
  "jwt",
  "libmount",
  "metrics-exporter-dogstatsd",
  "metrics-exporter-prometheus",
  "metrics",
  "metrics-util",
  "nix",
  "reqwest",
  "syslog",
  "tower-http",
  "tracing-subscriber",
  "tracing",
  "version-compare",
  "rustls-native-certs",
]
# Enables dist tests with external requirements
dist-tests = ["dist-client", "dist-server", "dep:thirtyfour"]
# Enables benches/sccache_bench.rs
bench = ["dep:divan"]

[workspace]
exclude = ["tests/test-crate"]
members = ["tests/integration/randomize_readdir"]

[[bench]]
harness = false
name = "sccache_bench"
required-features = ["bench"]
test = false

[lints]
workspace = true

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
cloned_ref_to_slice_refs = "warn"
explicit_into_iter_loop = "warn"
from_iter_instead_of_collect = "warn"
implicit_clone = "warn"
manual_string_new = "warn"
ptr_as_ptr = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
